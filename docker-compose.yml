version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: marktplaats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marktplaats
      POSTGRES_PASSWORD: marktplaats
      POSTGRES_DB: marktplaats_plus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: marktplaats_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
